# Einmalig: entfernt versehentlich ins Hauptverzeichnis hochgeladene Dateien und danach sich selbst.
name: Aufräumen

on: workflow_dispatch

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lose Dateien im Hauptverzeichnis entfernen
        run: |
          git rm -q --ignore-unmatch -- \
            App.tsx main.tsx styles.css \
            Icons.tsx ListForm.tsx Sheet.tsx TopBar.tsx WishForm.tsx WishRow.tsx \
            auth.tsx format.ts supabase.ts types.ts wishes.ts \
            Dashboard.tsx ListPage.tsx Login.tsx Setup.tsx \
            schema.sql 02_zugangsliste.sql 03_bilder.sql
          git rm -q .github/workflows/aufraeumen.yml
          git config user.name "Päckchen Aufräumen"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Lose Dateien im Hauptverzeichnis entfernt"
          git push
