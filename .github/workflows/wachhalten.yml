# Ruft Supabase einmal pro Woche kurz auf, damit das Gratis-Projekt nicht wegen Inaktivität pausiert.
name: Supabase wach halten

on:
  schedule:
    - cron: "0 6 * * 1"   # jeden Montag um 6:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kurzer Aufruf der Datenbank
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ vars.VITE_SUPABASE_URL }}/rest/v1/rpc/guest_list" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{"p_token":"wachhalten"}')
          echo "Antwort von Supabase: $status"
          test "$status" = "200"
