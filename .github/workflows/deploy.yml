# Prüft die App mit allen Tests und veröffentlicht sie nur, wenn alles grün ist.
# Bei Änderungsvorschlägen (Pull Requests, z. B. von Dependabot) laufen nur die Tests, ohne zu veröffentlichen.
name: Veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore: ["update*.zip"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Vorschläge laufen getrennt und brechen keine laufende Veröffentlichung ab
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sicherheitsprüfung der Bibliotheken (was Nutzer laden)
        # Bricht ab, wenn eine Bibliothek der App eine bekannte schwere Lücke hat.
        # Werkzeuge für Tests und Bauen zählen nicht mit (--omit=dev).
        run: npm audit --omit=dev --audit-level=high
      - name: Unit-Tests
        run: npm test
      - name: Datenbank-Tests
        run: ./supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
      - name: Browser für Oberflächentests installieren
        run: npx playwright install --with-deps chromium
      - name: Oberflächentests
        run: npm run test:e2e

  build:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
