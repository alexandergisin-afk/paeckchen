# Sichert jede Nacht Datenbank und Bilder, verschlüsselt mit BACKUP_PASSWORD.
# Die Sicherungen liegen 30 Tage unter Actions → Datensicherung → (Lauf) → Artifacts.
# Anleitung zum Einrichten und Wiederherstellen: BACKUP.md
name: Datensicherung

on:
  schedule:
    - cron: "30 2 * * *"   # jede Nacht um 2:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sichern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank-Werkzeuge (PostgreSQL 17) installieren
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17 jq
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "STAMP=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Sichern und verschlüsseln
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: bash scripts/sicherung.sh sicherung
      - name: Sicherung ablegen (30 Tage)
        uses: actions/upload-artifact@v4
        with:
          name: paeckli-sicherung-${{ env.STAMP }}
          path: sicherung/*.enc
          retention-days: 30
          if-no-files-found: error
