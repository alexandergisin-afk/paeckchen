# Dependabot nur für Sicherheitslücken: Normale Versions-Updates werden nicht vorgeschlagen
# (open-pull-requests-limit: 0), weil die Update-Pakete von Päckli die komplette Paketliste
# mitbringen und übernommene Vorschläge sonst wieder überschreiben würden.
# Sicherheitsupdates kommen weiterhin, wenn unter Settings → Code security
# „Dependabot security updates“ eingeschaltet ist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
